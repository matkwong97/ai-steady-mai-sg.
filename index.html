('dark')?'☀️ Day mode':'🌙 Night mode'}if(load('dark',false))document.body.classList.add('dark');$('#theme').textContent=document.body.classList.contains('dark')?'☀️ Day mode':'🌙 Night mode';function go(p){history.push(page);page=p;render();scrollTo(0,0);if(typeof pagerMailboxCheck==='function')pagerMailboxCheck()}function back(){page=history.pop()||'home';render();scrollTo(0,0)}function shell(s){$('#app').innerHTML=(page!=='home'?'<button class="secondary" onclick="back()">← Back</button>':'')+s+(page==='home'?footer():'')}function footer(){return `<footer class="support-footer"><div class="support-heading"><span class="support-heart">♡</span><h3>Enjoying your journey?</h3><p class="muted">If this little project made dating or relationships less stressful, you can support its next chapter. Totally optional, lah!</p></div><div class="support-qr-grid"><div class="support-qr-card"><span class="support-qr-label">DBS PayLah!</span><div class="support-qr-frame"><img src="assets/paylah-qr.jpg" alt="Scan DBS PayLah payment QR code" loading="lazy"></div><span class="support-qr-hint">Scan with PayLah!</span></div><div class="support-qr-card"><span class="support-qr-label">PayNow</span><div class="support-qr-frame"><img src="assets/paynow-qr.jpg" alt="Scan PayNow payment QR code" loading="lazy"></div><span class="support-qr-hint">Scan with your banking app</span></div></div><p class="small support-credit">Made with ♡ in Singapore · © Matthew Kwong, 2026</p><p class="small muted">Your answers stay in this browser. No account needed.</p></footer>`}function todayQuote(i){return `<p class="quote">“${random(quotes[i],Math.floor(Date.now()/86400000))}”</p>`}function name(i){const group=profile.gender==='female'?'female':'male';const custom=load('friend_names',{});return custom[group]?.[i]||names[group][i]}

ooter()}`)}else if(page.startsWith('chat'))shell(chatPage(Number(page.slice(4))));else if(page==='quizresult')shell(quizResult()+footer());else if(page==='itineraries')shell(itineraryResults()+footer());else if(page==='weddingguide')shell(weddingGuidePage()+footer())}function firstVisitProfileCard(){return `<div class="card profile-setup" id="profile-setup"><h2>First, tell us about yourself ♡</h2><p class="small muted">Just two quick details. We’ll remember your preferences on this device.</p><label for="age">Your age (18+)</label><input id="age" type="number" min="18" max="110" inputmode="numeric" value="${esc(profile.age||'')}"><label for="gender">Your gender</label><select id="gender"><option value="" ${!profile.gender?'selected':''} disabled>Choose your gender</option><option value="male" ${profile.gender==='male'?'selected':''}>Male — Alvin, Bryan, Calvin & David</option><option value="female" ${profile.gender==='female'?'selected':''}>Female — Angie, Bridget, Carrie & Demi</option></select><p class="small muted">Your four friends are chosen automatically.</p><button onclick="start()">Meet my friends →</button><p id="status" role="status" aria-live="polite"></p></div>`}

 [['Families for Life — relationship resources','https://familiesforlife.sg/'],['LifeSG — marriage and relationships','https://www.life.gov.sg/family-parenting/marriage-relationships'],['HealthHub — mental wellbeing','https://www.healthhub.sg/']],

function quizPage(){let a=load('quiz',[]),female=profile.gender==='female';return `<div class="card"><h2>${name(0)}'s friendly interrogation 😏</h2><p>“${female?'Girl, I’m going to ask you the questions your friends are too polite to ask. Don’t anyhow answer, hor.':'Bro, I’m not here to sugarcoat. Fifteen questions. You answer properly, I tell you what I see.'}”</p><p class="muted">15 multiple-choice questions · Not a clinical personality test</p>${questions.map(([q,opts],i)=>`<fieldset class="quiz"><legend>${i+1}. ${questionAlternates[i][(Math.floor(Date.now()/86400000)+i+(female?1:0))%3]}</legend>${opts.map((o,j)=>`<label class="choice"><input type="radio" name="q${i}" value="${j}" ${a[i]===j?'checked':''}><span>${o}</span></label>`).join('')}</fieldset>`).join('')}<button onclick="submitQuiz()">Okay ${name(0)}, judge me →</button><p class="small muted">Questions rotate daily while keeping the same 15 relationship themes.</p><p id="status"></p></div>`}
function submitQuiz(){let a=questions.map((_,i)=>document.querySelector('input[name="q'+i+'"]:checked')?.value??'');if(a.some(x=>x==='')){$('#status').textContent='Oi, all 15 questions first. No escaping the difficult ones!';return}store('quiz',a.map(Number));go('quizresult')}function quizResult(){let a=load('quiz',[]),traits=[['trust and steady commitment','shared experiences and laughter','growth and ambition','emotional closeness'],['a calm, cosy connection','an adventurous partnership','an active social life','a flexible balance']];let p=traits[0][a[0]||0],v=traits[1][a[1]||0],need=['consistency and patience','space to process feelings','gentle reassurance','practical teamwork'][a[2]||0];return `<h1>${name(0)}'s take on you 💗</h1><div class="card"><p>“${profile.gender==='female'?'Girl, listen.':'Bro, listen up.'} From your answers, you seem to value <strong>${p}</strong>, while enjoying <strong>${v}</strong>. Not bad ah — knowing these things early helps you choose wisely.”</p><h2>The partner you may be</h2><p>You could be a thoughtful partner who values ${esc(questions[3][1][a[3]||0].toLowerCase())} and wants to build something meaningful. Your preferences are clues, not a scientific personality diagnosis.</p><h2>What you may need in a partner</h2><p>Someone who offers ${need}, respects your boundaries, and can talk openly about differences. Look for compatible values, not just sparks.</p><h2>How your other friends will use this</h2><p>${esc(name(1))} will use your preferred date pace, social energy, spending style and ways of showing care to rank activities and suggest outfit details. These are preferences, not personality labels.</p><button class="secondary" onclick="go('friend1')">Let ${name(1)} plan with these insights →</button><h2>One thing to work on</h2><p>Be clear about your expectations without expecting anyone to read your mind. Good communication is attractive, lah.</p><nav><button onclick="saveQuizResult()">Save result</button><button class="secondary" onclick="copyQuizResult()">Copy</button><button class="secondary" onclick="shareQuizResult()">Share</button><button class="secondary" onclick="go('friend0')">Retake quiz</button></nav><p id="quizFeedback" role="status"></p></div>`}function quizResultText(){const el=document.createElement('div');el.innerHTML=quizResult();return (el.innerText||el.textContent||'').replace(/Save result.*$/s,'').trim()}function saveQuizResult(){const t=quizResultText();store('quizSaved',{text:t,date:new Date().toISOString(),answers:load('quiz',[])});const el=$('#quizFeedback');if(el)el.textContent='Saved on this device! 💗'}async function copyQuizResult(){const t=quizResultText();try{await navigator.clipboard.writeText(t);$('#quizFeedback').textContent='Copied!'}catch{prompt('Copy your result:',t)}}async function shareQuizResult(){const t=quizResultText();if(navigator.share){try{await navigator.share({title:'My AI Steady Mai SG relationship insights',text:t})}catch(e){if(e.name!=='AbortError')copyQuizResult()}}else copyQuizResult()}
function relationshipSignals(){const a=load('quiz',[]);if(a.length!==15)return null;const styles=['calm and cosy','adventurous and curious','social and energetic','balanced and flexible'];const labels=['quality time','acts of service','words of affirmation','thoughtful gifts'];const social=['quiet spaces','small groups','lively crowds','flexible company'];return {style:styles[a[1]||0],styleIndex:a[1]||0,love:labels[a[3]||0],social:social[a[6]||0],socialIndex:a[6]||0,spend:a[7]||0,communication:['talk it out promptly','take some space first','offer reassurance','solve things together'][a[2]||0],intent:['marriage and family','long-term partnership','exploring','undecided'][a[11]||0]}}function ageBand(){let n=Number(profile.age)||25;return n<30?'20s':n<40?'30s':n<50?'40s':n<60?'50s':'60+'}function ageDateContext(){const band=ageBand();return ({'20s':'Try discovery dates, playful activities and affordable new experiences.','30s':'Consider experiences that balance novelty with meaningful time together.','40s':'Consider quality conversation, culture and distinctive experiences without unnecessary rushing.','50s':'Consider comfortable pacing, cultural experiences and interesting food or performances.','60+':'Consider accessibility, seating, manageable walking and unhurried experiences.'})[band]}function quizBridge(){let q=relationshipSignals();return q?`<div class="insight"><strong>💗 ${name(0)}’s insights are in use</strong><p class="small">You lean toward ${esc(q.style)} experiences, appreciate ${esc(q.love)}, and prefer ${esc(q.social)}. ${name(1)} will use these as gentle hints, not rigid rules.</p><button class="secondary" onclick="go('quizresult')">Review my personality insights</button></div>`:`<div class="insight"><strong>Make your recommendations more personal</strong><p class="small">Complete ${name(0)}’s 15-question relationship quiz so ${name(1)} can tailor date ideas and outfit advice.</p><button class="secondary" onclick="go('friend0')">Take the quiz</button>< nction outfit(){let s=$('#style').value,setting=$('#setting').value,when=$('#outfitDate').value+'T'+String(slotHours($('#outfitSlot').value)[0]).padStart(2,'0')+':00',loc=$('#outfitLoc').value||'Singapore',result=$('#outfitResult');result.innerHTML='<p>Checking the forecast…</p>';let weather='Singapore is typically warm and humid. Pack a compact umbrella and a light layer for air-conditioned venues.';try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=1.3521&longitude=103.8198&hourly=temperature_2m,precipitation_probability&timezone=Asia%2FSingapore&forecast_days=3');if(!r.ok)throw Error();let j=await r.json(),idx=j.hourly.time.findIndex(t=>t.slice(0,13)===(when||new Date().toISOString()).slice(0,13));if(idx<0)idx=0;let max=Math.max(...j.hourly.precipitation_probability.slice(idx,idx+12)),temp=j.hourly.temperature_2m[idx];weather=`Singapore forecast near your chosen time: around ${temp}°C, with up to ${max}% hourly rain probability in the following 12 hours. This is a Singapore-wide forecast, not a street-level prediction.`}catch{}let female=profile.gender==='female',q=relationshipSignals();let tops=female?{'Casual & comfy':'airy cotton blouse or relaxed tee','Trendy streetwear':'statement top with a light overshirt','Smart casual':'breathable blouse or refined knit top','Chic & polished':'structured lightweight blouse or elegant midi dress'}:{'Casual & comfy':'breathable cotton tee or polo','Trendy streetwear':'relaxed overshirt over a plain tee','Smart casual':'linen or Oxford button-down shirt','Chic & polished':'lightweight collared shirt or unstructured blazer'};let bottom=female?(s==='Chic & polished'?'midi skirt or tailored trousers':'comfortable wide-leg trousers, skirt or jeans'):(s==='Casual & comfy'?'clean chinos or straight-cut jeans':'well-fitting chinos or tailored trousers');let extras=q?(q.styleIndex===1?' Add a practical crossbody or small bag for exploring.':q.styleIndex===0?' Keep the outfit understated and comfortable for a long chat.':q.styleIndex===2?' A tasteful accent colour can make it feel more expressive.':' Choose versatile pieces you can dress up or down.'):' Take the relationship quiz for a more personalised finishing touch.';let text=`For your ${ageBand()} and ${s.toLowerCase()} preference: Try ${tops[s]}, ${bottom}, and supportive, clean shoes. ${setting==='Mostly outdoor'?'Prioritise breathable fabrics, sun protection and walking comfort.':'Bring a light layer for strong air-conditioning.'}${extras} ${weather}`;let outfitAlternatives=female?['Swap trousers for a breezy midi skirt and choose lightweight flats.','Try a breathable coordinated set with comfortable sneakers and a small crossbody bag.','For a dressier mood, choose a simple midi dress with low heels or flats.']:['Try a relaxed linen shirt, straight-cut trousers and clean sneakers.','Swap to a textured polo, lightweight chinos and comfortable loafers.','For a smarter look, pair an unstructured overshirt with a plain tee and tailored trousers.'];let rotate=(new Date(when).getDate()+s.length+setting.length)%outfitAlternatives.length;let alternative=outfitAlternatives[rotate];if(q?.styleIndex===0)alternative+= ' Keep fabrics soft and fuss-free for a longer conversation.';if(setting==='Mostly outdoor')alternative+=' Avoid heavy layers in the humidity.';result.innerHTML=`<div class="card"><p>${esc(text)}</p><p><strong>Another outfit option:</strong> ${esc(alternative)}</p><p class="small muted">${esc(name(0))}'s quiz insights and your chosen style help personalise these combinations. Choose what feels comfortable and authentic to you.</p><a target="_blank" rel="noopener" href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent((female?'women womenswear female':'men menswear male')+' '+s+' Singapore date outfit inspiration')}">Browse outfit inspiration on Google Images ↗</a></div>`}function plan(){let o={a:$('#loc1').value.trim(),b:$('#loc2').value.trim(),time:$('#planDate').value+'T'+String(slotHours($('#planSl function recipeRank(r,v,weather){
 const text=(r.title+' '+r.category+' '+r.ingredients.join(' ')).toLowerCase();
 const soup=/soup|broth|stew|porridge|congee|laksa|mee sua|bak kut teh|ramen/.test(text);
 const pasta=/pasta|spaghetti|carbonara|aglio|macaroni|lasagne|linguine|fettuccine/.test(text);
 const cool=/salad|soba|cold|chilled|sandwich|sushi|poke|fruit/.test(text);
 const snack=/toast|snack|cake|cookie|pancake|dessert|sandwich|tart|waffle/.test(text);
 let score=0;
 if(v.kind==='soup')score+=soup?15:-3;
 if(v.kind==='pasta')score+=pasta?18:-3;
 if(v.kind==='cool')score+=cool?15:-3;
 if(v.kind==='snack')score+=snack?15:-3;
 if(weather==='rain')score+=soup?12:0;
 if(weather==='hot')score+=cool?12:0;
 if(v.kind==='dinner')score+=/rice|noodle|pasta|chicken|fish|tofu|beef|pork|vegetable/.test(text)?7:0;
 const mins=Number(r.minutes)||60;
 if(mins<=35)score+=6;else if(mins<=60)score+=4;else if(mins>110)score-=5;
 const signals=relationshipSignals?.();
 if(signals&&/adventur|explor|novel|spontan/i.test(JSON.stringify(signals)))score+=/japanese|korean|thai|indian|western|italian/.test(r.cuisine.toLowerCase())?3:0;
 return score;
}

let steadyScreenCache={};
function screenRecent(kind){return load('screenRecent_'+kind,[])}
async function screenRecommendations(kind,elementId){
 const el=document.getElementById(elementId);if(!el)return;
 try{
  let data=steadyScreenCache[kind];if(!data){const r=await fetch('/api/screen?kind='+kind,{signal:AbortSignal.timeout(10000)});data=await r.json();if(data.status==='live')steadyScreenCache[kind]=data}
  if(!document.getElementById(elementId))return;
  if(data.status!=='live'||!data.items?.length){el.innerHTML='<p class="small muted">Film suggestions unavailable right now.</p>';return}
  const recent=screenRecent(kind),items=data.items.filter(x=>x.votes>=40&&x.rating>=6.3);
  const pool=(items.length?items:data.items).filter(x=>!recent.includes(String(x.id)));
  const eligible=pool.length?pool:(items.length?items:data.items);
  const pick=eligible[Math.floor(Math.random()*eligible.length)];
  if(!pick)return;
  store('screenRecent_'+kind,[String(pick.id),...recent].slice(0,Math.min(12,Math.max(2,data.items.length-2))));
  el.innerHTML=`<p class="small"><strong>🎬 ${esc(pick.title)}</strong> · TMDB ${pick.rating??'N/A'}/10</p><p class="small muted">${kind==='netflix'?'Streaming availability':'Cinema showtimes'} not guaranteed. <a href="${esc(pick.link)}" target="_blank" rel="noopener">Film details ↗</a></p><button class="secondary" onclick="screenRecommendations('${kind}','${elementId}')">Try another title ↻</button>`;
 }catch{if(document.getElementById(elementId))el.textContent='Film suggestions temporarily unavailable.'}
}
async function nearbyDining(area,budget,elementId){
 const el=document.getElementById(elementId);if(!el)return;
 try{let r=await fetch('/api/restaurants?area='+encodeURIComponent(area),{signal:AbortSignal.timeout(10000)});let j=await r.json();if(!document.getElementById(elementId))return;
 if(j.status!=='live'||!j.items?.length)throw Error('Unavailable');
 const cafes=j.items.filter(x=>x.kind==='cafe'),restaurants=j.items.filter(x=>x.kind==='restaurant');
 const picks=(budget===1?[...cafes,...restaurants]:[...restaurants,...cafes]).slice(0,4);
 el.innerHTML='<h3>☕ Nearby dining ideas in '+esc(area)+'</h3>'+picks.map(x=>`<p><strong>${esc(x.name)}</strong> · ${x.kind==='cafe'?'Café':'Restaurant'}${x.cuisine?' · '+esc(x.cuisine):''} <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.name+' '+area+' Singapore')}">Map & menu ↗</a></p>`).join('')+'<p class="small muted">These are real mapped venues from OpenStreetMap, not price-verified matches. Your budget is a planning preference; check menus and opening hours before going.</p>';
 }catch{if(document.getElementById(elementId))el.innerHTML='<p class="small muted">Live restaurant lookup unavailable. <a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('cafes restaurants '+area+' Singapore')+'">Browse restaurants on Maps ↗</a></p>'}
}
function homeDateDetail(v,weather){
 const id='how-cook-match-'+Math.random().toString(36).slice(2);
 queueMicrotask(()=>loadHowCookCatalogue().then(all=>{
   const el=document.getElementById(id);if(!el)return;
   const ranked=[...all].sort((a,b)=>recipeRank(b,v,weather)-recipeRank(a,v,weather));
   const shortlist=ranked.slice(0,Math.min(12,ranked.length));
   const prev=load('recipeRecent',[]),fresh=shortlist.filter(r=>!prev.includes(String(r.id))),options=fresh.length?fresh:shortlist;const chosen=options[Math.floor(Math.random()*Math.min(7,options.length))];if(chosen)store('recipeRecent',[String(chosen.id),...prev].slice(0,8));
   el.innerHTML=chosen?recipeCardHtml(chosen,v,weather):'<p class="small">No verified recipes found.</p>';
 }).catch(()=>{const el=document.getElementById(id);if(el)el.textContent='How Cook SG catalogue could not be loaded. Please retry when online.'}));
 return `<div id="${id}" class="hc-recipe-card" aria-live="polite"><p class="small muted">Matching this date with a verified How Cook SG recipe…</p></div>`;
}

ire and respectful ways to include elders. Do not assume a custom based on someone's ethnicity or age.</p></details><details><summary>Day-of essentials</summary><p>Keep rings, required documents, vendor contact sheet, printed schedule, spare outfit items, tissues, water, snacks, chargers, medication, umbrella and a small emergency kit with a trusted coordinator.</p></details></div><div class="card"><h2>Your preparation checklist</h2>${weddingTasks.map((t,i)=>`<label class="task"><input type="checkbox" ${tasks[i]?'checked':''} onchange="toggleWeddingTask(${i},this.checked)"><span><strong>${esc(t[0])}</strong> · ${esc(t[1])}</span></label>`).join('')}</div><div class="card"><h2>Wedding-day sample run sheet</h2><p class="small muted">Illustrative timings. Adjust for your venue, solemnisation and cultural ceremonies.</p><div class="budget-table">${[['8:00 am','Breakfast, hair and makeup, detail photos'],['10:00 am','Family photos / optional customary ceremonies'],['12:00 pm','Solemnisation or preparation for evening programme'],['4:00 pm','Vendor briefing, sound check and venue walkthrough'],['6:00 pm','Guest arrival and registration'],['7:00 pm','Entrance, dinner, speeches and photos'],['10:00 pm','Guest send-off, vendor settlement and belongings check']].map(([time,desc])=>`<div class="budget-row"><strong>${time}</strong><span>${desc}</span></div>`).join('')}</div></div><div class="card"><h2>One last word from ${name(3)}</h2><p>“Your guests should feel welcomed, and you two should feel like yourselves. A thoughtful, well-run wedding beats an exhausting showpiece any day.”</p><p class="small muted">This planner is general guidance, not a substitute for official legal requirements or professional vendor quotations.</p></div>`}
function toggleWeddingTask(i,v){let t=load('weddingTasks',{});t[i]=v;store('weddingTasks',t);render()}function saveWeddingNotes(){store('weddingSeatNotes',$('#seatNotes').value)}function copyWeddingSummary(){let d=load('wedding',{}),left=weddingDays(d.date),t=load('weddingTasks',{});let content=`Wedding plan: ${d.date||'Date TBD'} (${left??'unknown'} days remaining)\nVenue: ${d.venue}\nBudget: ${weddingMoney(d.amount)}\nGuests: ${d.guests}, tables: ${Math.ceil(d.guests/d.seats)}\nNotes: ${load('weddingSeatNotes','')}\n\nChecklist:\n${weddingTasks.map((x,i)=>(t[i]?'[x] ':'[ ] ')+x[1]).join('\n')}`;navigator.clipboard?.writeText(content).then(()=>alert('Wedding plan copied!')).catch(()=>prompt('Copy your plan:',content))||prompt('Copy your plan:',content)}
function marriageAdvice(){let t=$('#challenge').value.trim();if(t.length<12){$('#advice').textContent='Tell me a little more about what happened, can?';return}let s=t.toLowerCase(),a=/violence|hit me|abuse|threat|unsafe|scared|forced/.test(s)?'Your safety matters more than fixing the argument. If you are in immediate danger in Singapore, call 999. Consider reaching out to a trusted person or a family violence support service.':/money|finance|spend|debt|saving|budget/.test(s)?'Money tension is common. Pick a calm time to compare your priorities, agree on shared expenses and set a spending threshold that requires discussion.':/chores|housework|clean|laundry|cook/.test(s)?'Uneven housework can build resentment. Write down recurring tasks together, divide ownership clearly and review the arrangement after two weeks.':/in-law|parents|family|mother|father/.test(s)?'Family boundaries can be delicate. Discuss what each of you needs privately first, then agree on a respectful message you can present as a team.':/intimacy|sex|affection|romance/.test(s)?'Different needs for closeness deserve a gentle conversation without pressure. Ask what helps each of you feel connected, and respect consent and boundaries.':/argu|fight|communicat|listen|ignored/.test(s)?'Try starting with “I feel…” rather than blame. Reflect back what your spouse says before responding, and agree to pause if the discussion gets heated.':'It sounds like something important is weighing on you. Try naming the specific moment that hurt, what you needed instead, and one small change you could request kindly.';$('#advice').innerHTML=`<div class="card"><p>“I hear you. ${esc(a)}”</p><p>“One small step today: ask, ‘Can we set aside 20 minutes to understand each other, without trying to win?’ You deserve to be heard, and so does your spouse.”</p><p class="small muted">This is general support, not professional counselling.</p></div>`}render();

function pagerMailboxPaint(){document.querySelectorAll('.pager-unread').forEach(el=>{el.textContent=pagerUnread>99?'99+':pagerUnread;el.classList.toggle('hidden',!pagerUnread)});document.querySelectorAll('.pager-mailbox').forEach(el=>el.setAttribute('aria-label','Open Love Pager inbox'+(pagerUnread?' — '+pagerUnread+' new pages':'')));const n=document.getElementById('pager-notice');if(n){n.hidden=!pagerUnread;n.textContent=pagerUnread?`💌 ${pagerUnread} new ${pagerUnread===1?'page':'pages'} from your person — tap to read`:''}}
async function pagerMailboxCheck(){if(!roomToken()||document.visibilityState==='hidden')return;try{const r=await roomAPI('inbox-state',undefined,Math.max(0,Number(localStorage.getItem(pagerSeenKey(pagerLastRoom||'unknown')))||0));if(r.room_id!==pagerLastRoom){pagerLastRoom=r.room_id;const last=Number(localStorage.getItem(pagerSeenKey(r.room_id))||0);const correct=await roomAPI('inbox-state',undefined,last);pagerUnread=correct.unread;pagerLatest=correct.latest;}else{pagerUnread=r.unread;pagerLatest=r.latest;}pagerMailboxPaint()}catch(e){if(e.message.includes('no longer valid')){pagerUnread=0;pagerMailboxPaint()}}}
function pagerMarkRead(){if(pagerLastRoom){localStorage.setItem(pagerSeenKey(pagerLastRoom),String(Math.max(Date.now(),pagerLatest)));pagerUnread=0;pagerMailboxPaint()}}
setInterval(pagerMailboxCheck,25000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pagerMailboxCheck()});

async function roomAPI(action,data,since){let response;try{response=await fetch('/api/room?action='+encodeURIComponent(action)+(since===undefined?'':'&since='+encodeURIComponent(since)),{method:data===undefined?'GET':'POST',headers:{'content-type':'application/json',...(roomToken()?{authorization:'Bearer '+roomToken()}:{})},...(data===undefined?{}:{body:JSON.stringify(data)})})}catch{throw Error('Cannot reach the pager service. Check your connection.')}let body={};try{body=await response.json()}catch{}if(!response.ok)throw Error(body.error||(response.status===404?'Pager service not deployed.':'Pager request failed ('+response.status+').'));return body}

const scrapbookDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('steady_scrapbook',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function scrapbookAll(){const db=await scrapbookDB();return new Promise((res,rej)=>{const tx=db.transaction('photos','readonly');const r=tx.objectStore('photos').getAll();r.onsuccess=()=>res(r.result.sort((a,b)=>b.created-a.created));r.onerror=()=>rej(r.error);tx.oncomplete=()=>db.close()})}
const albumKey='steady_scrapbook_albums_v26';
function albumList(){let albums=load(albumKey,null);if(!Array.isArray(albums)||!albums.length){albums=[{id:'memories',name:'Our Memories',created:Date.now()}];store(albumKey,albums)}return albums}
function albumName(id){return albumList().find(a=>a.id===id)?.name||'Our Memories'}
function albumCreate(){const input=document.getElementById('new-album-name');const name=(input?.value||'').trim().slice(0,55);if(!name){loveMsg('Give your scrapbook a name first.');return}const albums=albumList();const id=crypto.randomUUID();albums.push({id,name,created:Date.now()});store(albumKey,albums);scrapbookPage()}

async function scrapbookSave(e){e.preventDefault();const file=document.getElementById('memory-photo').files[0];if(!file||!file.type.startsWith('image/')||file.size>8*1024*1024){loveMsg('Choose a photo under 8 MB.');return}const canvas=document.createElement('canvas'),img=new Image(),url=URL.createObjectURL(file);try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));if(!blob)throw Error('Photo conversion failed');const db=await scrapbookDB();await new Promise((resolve,reject)=>{const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put({id:crypto.randomUUID(),albumId:document.getElementById('memory-album').value,title:document.getElementById('memory-title').value.slice(0,90),date:document.getElementById('memory-date').value,caption:document.getElementById('memory-caption').value.slice(0,500),blob,created:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();scrapbookPage()}catch{loveMsg('Could not save this photo. Check device storage.')}finally{URL.revokeObjectURL(url)}}
async function scrapbookDelete(id){if(!confirm('Delete this memory from this device?'))return;const db=await scrapbookDB();const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);tx.oncomplete=()=>{db.close();albumOpen(activeAlbum)}}
async function scrapbookExport(){const photos=await scrapbookAll();const items=await Promise.all(photos.map(async x=>({albumId:x.albumId||'memories',title:x.title,date:x.date,caption:x.caption,photo:await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(x.blob)})})));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:2,albums:albumList(),memories:items})],{type:'application/json'}));a.download='ai-steady-mai-scrapbooks-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000)}
async function scrapbookPage(){const albums=albumList();loveShell('Your Scrapbook Library',`<div class="card"><h2>Capture a memory</h2><form onsubmit="scrapbookSave(event)"><label>Choose a scrapbook</label><select id="memory-album">${albums.map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('')}</select><label>Photo</label><input id="memory-photo" type="file" accept="image/*" required><label>Memory title</label><input id="memory-title" maxlength="90" required placeholder="A day to remember"><label>Date</label><input id="memory-date" type="date" required value="${new Date().toISOString().slice(0,10)}"><label>Handwritten note (optional)</label><textarea id="memory-caption" maxlength="500" placeholder="A little story behind this moment…"></textarea><button type="submit">Save to scrapbook ♡</button></form><p id="love-status" class="account-feedback" role="status"></p></div><section class="album-library"><div class="album-heading"><h2>My scrapbooks</h2><p class="muted small">Organise memories by year, holiday or occasion.</p></div><div class="card album-create"><label for="new-album-name">New scrapbook</label><div class="album-create-row"><input id="new-album-name" maxlength="55" placeholder="e.g. Japan Trip · 2026"><button onclick="albumCreate()">Create</button></div></div><div id="album-collection" class="album-grid"></div><p class="muted small">Photos are saved only on this device, even when signed in. Back them up before clearing Safari data.</p><button class="secondary" onclick="scrapbookExport()">Export all scrapbooks</button></section>`);try{const photos=await scrapbookAll(),grid=document.getElementById('album-collection');for(const a of albums){const items=photos.filter(p=>(p.albumId||'memories')===a.id);const card=document.createElement('button');card.className='album-cover';const label=document.createElement('span');label.className='album-cover-label';label.textContent=a.name;const count=document.createElement('small');count.textContent=items.length+' '+(items.length===1?'memory':'memories');if(items.length){const img=document.createElement('img');img.src=URL.createObjectURL(items[0].blob);img.alt='';img.onload=()=>URL.revokeObjectURL(img.src);card.append(img)}else{const art=document.createElement('span');art.className='album-cover-art';art.textContent='✿';card.append(art)}card.append(label,count);card.onclick=()=>albumOpen(a.id);grid.append(card)}}catch{loveMsg('Photo storage is unavailable in this browser.')}}
async function albumOpen(id){activeAlbum=id;const albumTitle=albumName(id);loveShell(esc(albumTitle),`<button class="secondary" onclick="scrapbookPage()">← All scrapbooks</button><p class="muted">The little moments worth keeping.</p><div id="album-pages" class="album-pages"></div><p id="love-status" role="status"></p>`);try{const photos=(await scrapbookAll()).filter(p=>(p.albumId||'memories')===id),area=document.getElementById('album-pages');if(!photos.length){area.innerHTML='<div class="paper-page"><p class="hand-note">Your story starts with the first photograph… ♡</p></div>';return}for(const p of photos){const sheet=document.createElement('article');sheet.className='paper-page';const photo=document.createElement('div');photo.className='polaroid';const img=document.createElement('img');img.src=URL.createObjectURL(p.blob);img.alt=p.title;img.onload=()=>URL.revokeObjectURL(img.src);const label=document.createElement('div');label.className='polaroid-title';label.textContent=p.title;photo.append(img,label);const info=document.createElement('div');info.className='paper-notes';const date=document.createElement('time');date.textContent=p.date;const caption=document.createElement('p');caption.className='hand-note';caption.textContent=p.caption||'A moment to remember ♡';const del=document.createElement('button');del.className='paper-delete';del.textContent='Delete memory';del.onclick=()=>scrapbookDelete(p.id);info.append(date,caption);const notes=['This one deserves a little heart!','Okay, this memory is adorable.','What a beautiful moment to keep.','The little moments really matter.'];let seed=0;for(const ch of p.id)seed+=ch.charCodeAt(0);if(profileReady()&&seed%4===0){const sticker=document.createElement('aside');sticker.className='friend-scrap-note';const who=Math.floor(seed/4)%4;sticker.textContent=['💗','👍','🔥'][seed%3]+' '+name(who)+': '+notes[who];info.append(sticker)}info.append(del);sheet.append(photo,info);area.append(sheet)}}catch{loveMsg('Unable to load this scrapbook.')}}

let sharedCache={albums:[],memories:[]};
async function sharedScrapbookPage(){loveShell('Our Shared Scrapbooks',`<p class="muted">Only you and your linked partner can view and add to these albums. Your existing private scrapbooks stay on your own phone.</p><div class="card"><h2>Create a shared album</h2><label>Album name</label><input id="shared-name" maxlength="60" placeholder="Our adventures"><button onclick="sharedAlbumCreate()">Create album ♡</button></div><div class="card"><h2>Add a shared memory</h2><form onsubmit="sharedMemoryAdd(event)"><label>Album</label><select id="shared-album" required></select><label>Title</label><input id="shared-title" maxlength="90" required><label>Memory date</label><input id="shared-date" type="date" required value="${new Date().toISOString().slice(0,10)}"><label>Photo (optional)</label><input id="shared-photo" type="file" accept="image/*"><label>Story</label><textarea id="shared-caption" maxlength="700"></textarea><button type="submit">Save our memory ♡</button></form></div><p id="love-status" role="status" aria-live="polite"></p><div id="shared-gallery">Loading…</div><button class="secondary" onclick="sharedExport()">Export shared memories</button>`);await sharedRefresh()}

async function sharedPhoto(file){if(!file)return null;if(!file.type.startsWith('image/')||file.size>12*1024*1024)throw Error('Choose an image under 12 MB');const u=URL.createObjectURL(file),img=new Image();try{await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=u});let scale=Math.min(1,650/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');for(let i=0;i<7;i++){c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',Math.max(.36,.72-i*.06));if(data.length<125000)return data;scale*=.76}throw Error('Image could not be compressed enough. Try a smaller photo.')}finally{URL.revokeObjectURL(u)}}
async function sharedMemoryAdd(e){e.preventDefault();const b=e.target.querySelector('button[type=submit]');b.disabled=true;try{await sharedAPI('add',{album_id:document.getElementById('shared-album').value,title:document.getElementById('shared-title').value,memory_date:document.getElementById('shared-date').value,caption:document.getElementById('shared-caption').value,photo_data:await sharedPhoto(document.getElementById('shared-photo').files[0])});await sharedRefresh();loveMsg('Memory saved for both of you ♡')}catch(e){loveMsg(e.message)}finally{b.disabled=false}}
async function sharedRemove(id){if(!confirm('Delete this memory for both partners?'))return;try{await sharedAPI('delete',{id});await sharedRefresh();loveMsg('Memory deleted.')}catch(e){loveMsg(e.message)}}
function sharedExport(){const u=URL.createObjectURL(new Blob([JSON.stringify({version:33,...sharedCache})],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='our-shared-scrapbooks.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}

function loveRoute(){if(!profileReady()){page='home';history=[];oldRender();return}if(page==='lovespace')loveHome();else if(page==='littlelove')dailyLove();else if(page==='lovejourney')loveJourneyPage();else if(page==='couplecards')coupleCards();else if(page==='scrapbook')scrapbookPage();else if(page==='sharedscrapbook')sharedScrapbookPage();else if(page==='pager')pagerPage();else if(page==='account')pagerPage()}
const oldRender=render;render=function(){if(['lovespace','littlelove','lovejourney','couplecards','scrapbook','sharedscrapbook','pager','account'].includes(page))loveRoute();else{oldRender();if(page==='home'){const app=document.getElementById('app');const div=document.createElement('div');div.className='card love-intro';div.innerHTML='<h2>💗 Your Love Space</h2><p>Daily gestures, meaningful questions, precious memories and a little pager for your person.</p><button onclick="go(\'lovespace\')">Explore Love Space →</button>';app.insertBefore(div,app.firstChild)}if(page==='friends'){const edit=document.querySelector('.name-grid')?.closest('.card');if(edit){const box=document.createElement('div');box.innerHTML='<label for="partner-name-friends">Your partner’s name or nickname</label><input id="partner-name-friends" maxlength="50" placeholder="e.g. Jas" value="'+esc(load('partner_name',''))+'"><button class="secondary" onclick="store(\'partner_name\',document.getElementById(\'partner-name-friends\').value.trim());render()">Save partner name</button>';edit.append(box)}}}};
const previousOfflineReply=typeof offlineReply==='function'?offlineReply:null;
if(previousOfflineReply){offlineReply=function(i,message,history){let result=previousOfflineReply(i,message,history);const partner=load('partner_name','').trim();if(partner&&typeof result==='string')result=result.replace(/\byour partner\b/gi,partner).replace(/\byour girlfriend\b/gi,partner).replace(/\byour boyfriend\b/gi,partner);return result}}
// Initialise only after every script and its const declarations have finished.
document.addEventListener('DOMContentLoaded', function(){ render(); }, {once:true});

/* v36 Love Journey: secular, original, flexible; private reflections never sent to the server. */
const journeyKey='love_journey_v36';
const journeyState=()=>{const a=load(journeyKey,{});return a&&typeof a==='object'?a:{}};
const journeyPartner=()=>String(load('relationship_profile',{})?.partner||load('partner_name','')||'your partner').trim().slice(0,50)||'your partner';
const journeyText=s=>String(s).replace(/\{partner\}/g,journeyPartner());
let journeyFilter='all',journeySelected='',journeySharedCache=[];
const journeyEntries=()=>Object.values(journeyState());
function journeySave(id,update){const state=journeyState();state[id]={...(state[id]||{}),...update,updated:Date.now()};store(journeyKey,state)}
function journeyBadge(ch){const entry=journeyState()[ch.id]||{};return entry.done?'✓ Completed':entry.fav?'♡ Favourite':entry.started?'In progress':'Not started'}
function loveJourneyPage(){
 const state=journeyState(),completed=LOVE_JOURNEY_CHALLENGES.filter(c=>state[c.id]?.done).length;
 const started=LOVE_JOURNEY_CHALLENGES.filter(c=>state[c.id]?.started&&!state[c.id]?.done).length;
 const next=LOVE_JOURNEY_CHALLENGES.find(c=>!state[c.id]?.done);
 const opts=['all','inprogress','favourites','completed',...new Set(LOVE_JOURNEY_CHALLENGES.map(c=>c.category))];
 const filtered=LOVE_JOURNEY_CHALLENGES.filter(c=>journeyFilter==='all'||(journeyFilter==='inprogress'&&state[c.id]?.started&&!state[c.id]?.done)||(journeyFilter==='favourites'&&state[c.id]?.fav)||(journeyFilter==='completed'&&state[c.id]?.done)||journeyFilter===c.category);
 loveShell('Our Love Journey 🌱',`
 <p class="muted">72 original relationship challenges. No streaks, no deadlines, no pressure. Choose what feels right for you and ${esc(journeyPartner())}. Every small effort counts.</p>
 <div class="card"><h2>Your progress ♡</h2><p><strong>${completed} of ${LOVE_JOURNEY_CHALLENGES.length}</strong> completed · ${started} in progress</p><div style="height:12px;border-radius:20px;background:#e5d7df;overflow:hidden"><div style="width:${completed/LOVE_JOURNEY_CHALLENGES.length*100}%;height:100%;background:#df4676"></div></div><p class="small muted">Take a break whenever you need. Your progress is saved on this device.</p>${next?'<button onclick="journeyOpen(\''+next.id+'\')">Continue: '+esc(next.title)+' →</button>':'<p>Revisit your favourites whenever you like.</p>'}</div>
 <div class="card"><h2>Find a challenge</h2><label for="journey-filter">Show me</label><select id="journey-filter" onchange="journeyChangeFilter(this.value)">${opts.map(x=>`<option value="${esc(x)}" ${x===journeyFilter?'selected':''}>${esc(({all:'All challenges',inprogress:'In progress',favourites:'My favourites',completed:'Completed'})[x]||x)}</option>`).join('')}</select>
 <div class="journey-grid">${filtered.map(c=>`<button type="button" class="journey-choice" onclick="journeyOpen('${c.id}')"><span class="small muted">${esc(c.category)} · ${c.id.slice(-3)}</span><strong>${esc(c.title)}</strong><span class="small">${esc(journeyBadge(c))}</span></button>`).join('')||'<p>No challenges in this view yet.</p>'}</div></div>
 <div class="card"><h2>Do it together ♡</h2><p class="small">If you're linked through Love Pager, you can share a challenge with your partner. Your personal reflection remains private. Each of you can mark your own progress.</p><button class="secondary" onclick="journeyShared()">Our couple challenges ↗</button><p id="journey-shared-status" role="status"></p><div id="journey-shared-list"></div></div>`);
}
function journeyChangeFilter(value){journeyFilter=value;loveJourneyPage()}
function journeyOpen(id){
 const c=LOVE_JOURNEY_CHALLENGES.find(x=>x.id===id);if(!c)return;
 journeySelected=id;const e=journeyState()[id]||{};if(!e.started)journeySave(id,{started:true});
 const idx=LOVE_JOURNEY_CHALLENGES.indexOf(c);
 loveShell(esc(c.title),`
 <button class="secondary" onclick="loveJourneyPage()">← All challenges</button>
 <div class="card"><p class="small muted">${esc(c.category)} · Challenge ${idx+1} of 72</p><h2>Today's invitation</h2><p>${esc(journeyText(c.action))}</p><h3>Why this helps</h3><p>${esc(c.why)}</p><p class="small muted">Only try this if it's safe, appropriate and comfortable for both of you. Mutual consent and boundaries always matter.</p></div>
 <div class="card"><h2>A little note from ${esc(name(idx%4))}</h2><p>${esc(['Small, sincere steps make a difference. No need to rush the process.','Bro, consistency beats one big dramatic gesture lah.','Take the time to understand each other, not just finish the task.','Make it practical, sustainable and fair for both of you.'][idx%4])}</p></div>
 <div class="card"><h2>Your private reflection</h2><p>${esc(c.reflection)}</p><textarea id="journey-reflection" maxlength="2500" rows="5" placeholder="What happened? What did you learn?">${esc(e.reflection||'')}</textarea><p class="small muted">Saved only on this device. Never shared with your partner.</p>
 <button onclick="journeyUpdate('${id}','reflection')">Save reflection</button>
 <button class="secondary" onclick="journeyUpdate('${id}','done')">${e.done?'✓ Completed — tap to reopen':'Mark completed ✓'}</button>
 <button class="secondary" onclick="journeyUpdate('${id}','fav')">${e.fav?'♥ Saved favourite':'♡ Save favourite'}</button><p id="love-status" role="status" aria-live="polite"></p></div>
 <div class="card"><h2>Invite ${esc(journeyPartner())} to try this</h2><p class="small">Your partner can accept the challenge from their own Love Journey page once you're linked through Love Pager. No personal reflection is sent.</p><button onclick="journeyInvite('${id}')">Share this challenge ♡</button><p id="journey-share-feedback" role="status" aria-live="polite"></p></div>
 <div class="journey-nav"><button class="secondary" onclick="journeyOpen('${LOVE_JOURNEY_CHALLENGES[(idx+71)%72].id}')">← Previous</button><button onclick="journeyOpen('${LOVE_JOURNEY_CHALLENGES[(idx+1)%72].id}')">Next →</button></div>`);
}
function journeyUpdate(id,mode){
 const e=journeyState()[id]||{},note=document.getElementById('journey-reflection')?.value||'';
 if(mode==='reflection'){journeySave(id,{reflection:note});loveMsg('Reflection saved privately ♡');return}
 if(mode==='done')journeySave(id,{done:!e.done,reflection:note,started:true});
 if(mode==='fav')journeySave(id,{fav:!e.fav,reflection:note});
 journeyOpen(id);loveMsg(mode==='done'&&!e.done?'Beautiful effort. Challenge completed ♡':'Preferences saved ♡');
}
async function journeyAPI(action,data){
 if(!roomToken())throw Error('Connect your Couple Room through Love Pager first.');
 const r=await fetch('/api/love-journey?action='+encodeURIComponent(action),{method:data?'POST':'GET',headers:{authorization:'Bearer '+roomToken(),'content-type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});
 let j={};try{j=await r.json()}catch{}if(!r.ok)throw Error(j.error||'Could not connect to your couple challenges.');return j;
}
async function journeyInvite(id){
 const el=document.getElementById('journey-share-feedback');if(el)el.textContent='Sharing…';
 try{await journeyAPI('share',{challenge_id:id});if(el)el.textContent='Shared ♡ Your partner can open Love Journey → Our couple challenges.'}
 catch(e){if(el)el.textContent=e.message}
}
async function journeyShared(){
 const el=document.getElementById('journey-shared-list'),status=document.getElementById('journey-shared-status');
 if(el)el.textContent='Checking your shared challenges…';
 try{const r=await journeyAPI('list');journeySharedCache=r.items||[];
 if(el)el.innerHTML=journeySharedCache.length?journeySharedCache.map(x=>{const c=LOVE_JOURNEY_CHALLENGES.find(c=>c.id===x.challenge_id);if(!c)return '';
 return `<div class="journey-shared-row"><strong>${esc(c.title)}</strong><p class="small muted">${esc(x.my_status==='done'?'You: completed':'You: not completed')} · ${esc(x.partner_status==='done'?'Partner: completed':'Partner: not completed')}</p><button class="secondary" onclick="journeyOpen('${c.id}')">Read challenge</button><button onclick="journeySharedDone('${c.id}',${x.my_status==='done'?'false':'true'})">${x.my_status==='done'?'Mark not completed':'I completed this ✓'}</button></div>`}).join(''):'<p>No shared challenges yet. Open any challenge and tap Share.</p>';
 if(status)status.textContent='Shared progress is visible to both partners. Private reflections stay on each device.'}
 catch(e){if(el)el.textContent='';if(status)status.textContent=e.message}
}
async function journeySharedDone(id,done){
 try{await journeyAPI('progress',{challenge_id:id,done});journeySave(id,{done:!!done,started:true});await journeyShared()}
 catch(e){const el=document.getElementById('journey-shared-status');if(el)el.textContent=e.message}
}
